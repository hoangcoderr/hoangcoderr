<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 276" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#11161d" />
    </linearGradient>
    <clipPath id="c1Clip"><rect x="2" y="2" width="460" height="128" rx="8" /></clipPath>
    <clipPath id="c2Clip"><rect x="478" y="2" width="460" height="128" rx="8" /></clipPath>
    <clipPath id="c3Clip"><rect x="2" y="146" width="460" height="128" rx="8" /></clipPath>
    <clipPath id="c4Clip"><rect x="478" y="146" width="460" height="128" rx="8" /></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .card-idx { font-size: 11.5px; font-weight: 700; fill: #58a6ff; }
      .card-title { font-size: 12px; font-weight: 700; fill: #e6edf3; letter-spacing: 0.2px; }
      .badge { font-size: 10px; font-weight: 600; }
      .key { font-size: 11px; font-weight: 600; fill: #8b949e; }
      .val { font-size: 11.5px; fill: #c9d1d9; }
    </style>
  </defs>

  <!-- ==================== CARD 1: REVERSE ENGINEERING ==================== -->
  <g clip-path="url(#c1Clip)">
    <rect x="2" y="2" width="460" height="128" rx="8" fill="url(#cardBg)" />
    <rect x="2" y="2" width="460" height="34" fill="#161b22" />
    <line x1="2" y1="36" x2="462" y2="36" stroke="#30363d" stroke-width="1" />
    <rect x="2" y="2" width="3" height="128" fill="#58a6ff" />

    <text x="18" y="23" class="mono card-idx">[0x01]</text>
    <text x="68" y="23" class="sans card-title">REVERSE ENGINEERING &amp; LOW-LEVEL</text>

    <rect x="374" y="9" width="74" height="19" rx="4" fill="#0d1117" stroke="#238636" stroke-width="1" />
    <text x="386" y="22" class="mono badge" fill="#3fb950">PRIMARY</text>

    <text x="18" y="61" class="mono key">BINARY</text>
    <text x="96" y="61" class="mono val">PE64 · ELF64 · x86/x64 ASM · Win32 API</text>

    <text x="18" y="86" class="mono key">RUNTIME</text>
    <text x="96" y="86" class="mono val">.NET (dnSpy) · Unity IL2CPP · Frida/APK</text>

    <text x="18" y="111" class="mono key">TOOLING</text>
    <text x="96" y="111" class="mono val">IDA Pro · Ghidra · x64dbg · GDB · MinHook</text>
  </g>
  <rect x="2" y="2" width="460" height="128" rx="8" fill="none" stroke="#30363d" stroke-width="1.2" />

