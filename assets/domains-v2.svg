  <g clip-path="url(#c4Clip)">
    <rect x="478" y="146" width="460" height="128" rx="8" fill="url(#cardBg)" />
    <rect x="478" y="146" width="460" height="34" fill="#161b22" />
    <line x1="478" y1="180" x2="938" y2="180" stroke="#30363d" stroke-width="1" />

    <text x="494" y="167" class="mono card-idx">[0x04]</text>
    <text x="544" y="167" class="sans card-title">GAME DEV &amp; ENGINE INTERNALS</text>

    <rect x="850" y="153" width="74" height="19" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
